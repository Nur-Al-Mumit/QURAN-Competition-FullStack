version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx
    restart: always
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www:ro
      # SSL Mounts directly from host via .env paths
      - ${SSL_CERT_PATH}:/etc/nginx/ssl/fullchain.pem:ro
      - ${SSL_KEY_PATH}:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - qrc-img-network

  backend:
    build:
      context: ./backend
    container_name: ${COMPOSE_PROJECT_NAME}-backend
    restart: always
    expose:
      - "9000"
    environment:
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - qrc-img-network

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME}-frontend
    restart: always
    environment:
      NUXT_PUBLIC_API_BASE: ${API_BASE_URL}
      NODE_ENV: ${APP_ENV}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - qrc-img-network

  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME}-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - qrc-img-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME}-phpmyadmin
    restart: always
    # No public port mapping. Handled strictly inside the bridge network by Nginx.
    environment:
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
      PMA_ABSOLUTE_URI: https://rdb.eshoquranshikhi.org/
    depends_on:
      db:
        condition: service_healthy
    # Removed profiles: - dev so it loads reliably in production
    networks:
      - qrc-img-network

volumes:
  mysql_data:

networks:
  qrc-img-network:
    driver: bridge