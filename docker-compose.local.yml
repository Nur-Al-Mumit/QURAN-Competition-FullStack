version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: eqs-nginx-local
    restart: always
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - phpmyadmin
    networks:
      - eqs-network-local

  frontend:
    image: node:18-alpine
    container_name: eqs-frontend-local
    restart: always
    working_dir: /src
    volumes:
      - ./frontend:/src
    command: npm run dev
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - eqs-network-local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eqs-backend-local
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - ./backend:/var/www
    working_dir: /var/www
    env_file:
      - .env
    networks:
      - eqs-network-local

  db:
    image: mysql:8.0
    container_name: eqs-mysql-local
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_local_data:/var/lib/mysql
    networks:
      - eqs-network-local

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: eqs-phpmyadmin-local
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - eqs-network-local

networks:
  eqs-network-local:
    driver: bridge

volumes:
  mysql_local_data:
