# Catch-all block to handle raw IP address hits safely
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/eshoquranshikhi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eshoquranshikhi.org/privkey.pem;

    # Option A:
    return 301 https://eshoquranshikhi.org$request_uri;

    # Option B:
    # return 444; 
}

# 1. Frontend Route
server {
    listen 80;
    listen 443 ssl;
    server_name eshoquranshikhi.org;

    ssl_certificate /etc/letsencrypt/live/eshoquranshikhi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eshoquranshikhi.org/privkey.pem;

    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Backend Route
server {
    listen 80;
    listen 443 ssl;
    server_name backend.eshoquranshikhi.org;

    ssl_certificate /etc/letsencrypt/live/eshoquranshikhi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eshoquranshikhi.org/privkey.pem;

    if ($http_x_forwarded_proto != "https") {
        return 307 https://$host$request_uri;
    }

    # Define the entry point root folder inside the backend container
    root /var/www/public;
    index index.php;

    location / {
        # First try to serve the request as a static file, 
        # otherwise pass it over to Laravel's index.php route file
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cleanly process all PHP execution requests via FastCGI on Port 9000
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
        
        # Keep cloudflare header awareness intact
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }
}

# 3. phpMyAdmin Route
server {
    listen 80;
    listen 443 ssl;
    server_name rdb.eshoquranshikhi.org;

    ssl_certificate /etc/letsencrypt/live/eshoquranshikhi.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eshoquranshikhi.org/privkey.pem;

    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://phpmyadmin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}