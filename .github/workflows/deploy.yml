name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/eqs-qrc-frontend-img:latest

    - name: Build & Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/eqs-qrc-backend-img:latest

    - name: Trigger Remote SSH Server Update
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EQS_EC2_IP_HOST }}
        username: ubuntu
        key: ${{ secrets.EQS_EC2_SERVER_SSH_KEY }}
        script_stop: true
        script: |
          cd /home/ubuntu/eqs-app
          
          # 🔐 Log into Docker Hub directly on the EC2 host using your existing secrets
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          
          # Pull down only the fresh application logic images built by GitHub
          docker compose pull frontend backend
          
          # Hot-swap containers seamlessly using your stable host configuration files
          docker compose up -d --no-deps frontend backend nginx
          
          # 🧼 Security cleanup: Log out after pulling private images
          docker logout